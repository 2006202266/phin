<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz app</title>
    <link rel="stylesheet" href="phin.css">
</head>
<body>
    <div id="container">
        <h1>Advanced quiz</h1>
        <div id="progress">
            Question<span id="question-number">1</span>
            of 
            <span id="total-questions">0</span>
        </div>
        <div id="timer">Time:15</div>
        <div id="question"></div>
        <div id="answers"></div>
        <button id="btn">Next</button>
    </div>
    <div id="results-container">
        <h1>Quiz Results</h1>
        <div class="score-box">
            <h2 id="percentage">0%</h2>
            <p>
                Answered:
                <span id="Answered-count">0</span>
                /
                <span id="result-total">0</span>
            </p>
            <p>
                correct:
                <span id="correct-count">0</span>
            </p>
            <p >
                Incorrect:
                <span id="incorrect-count">0</span>
            </p>
        </div>
        <h2>Question Summary</h2>
        <div id="Summary"></div>
        <button id="restart-btn">Restart Quiz</button>
    </div>
    <script src="phin.js"></script>
    
</body>
</html>
